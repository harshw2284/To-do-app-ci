name: Continuous Integration (CI)

on:
    workflow_dispatch

jobs:
    lint:
        name: Lint 
        runs-on: ubuntu-latest
        steps:
            - name: Code checkout
              uses: actions/checkout@v4
              
            - name: Setup Python 
              uses: actions/setup-python@v5
              with:
                python-version: 3.12

            - name: Install Dependencies
              run: pip install -r requirements.txt

            - name: Run Linter
              run: flake8 app.py

