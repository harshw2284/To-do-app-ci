<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --success: #10b981;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 520px;
            background: var(--card-bg);
            padding: 32px;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border);
        }

        .header {
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.025em;
        }

        .status-badge {
            display: inline-block;
            font-size: 0.75rem;
            padding: 4px 10px;
            background: rgba(99, 102, 241, 0.15);
            color: var(--accent);
            border-radius: 9999px;
            margin-top: 6px;
            font-weight: 600;
        }

        .add-form {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: #0f172a;
            color: var(--text);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--accent);
        }

        button.btn-add {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button.btn-add:hover {
            background: var(--accent-hover);
        }

        .todo-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .todo-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 10px;
            transition: transform 0.1s, border-color 0.2s;
        }

        .todo-item:hover {
            border-color: #475569;
        }

        .todo-text {
            font-size: 0.95rem;
            color: var(--text);
            text-decoration: none;
            flex: 1;
            cursor: pointer;
        }

        .todo-item.done .todo-text {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        .btn-action {
            text-decoration: none;
            font-size: 0.85rem;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: 500;
        }

        .btn-toggle {
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
        }

        .btn-delete {
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger);
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            padding: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Task Management API</h1>
            <span class="status-badge">● Environment: Production / CI</span>
        </div>

        <form class="add-form" action="/add" method="POST">
            <input type="text" name="task" placeholder="Enter a new task..." required autocomplete="off">
            <button type="submit" class="btn-add">Add Task</button>
        </form>

        <ul class="todo-list">
            {% for todo in todos %}
            <li class="todo-item {% if todo.done %}done{% endif %}">
                <span class="todo-text">{{ todo.task }}</span>
                <div class="actions">
                    <a href="/toggle/{{ todo.id }}" class="btn-action btn-toggle">
                        {% if todo.done %}Undo{% else %}Done{% endif %}
                    </a>
                    <a href="/delete/{{ todo.id }}" class="btn-action btn-delete">Delete</a>
                </div>
            </li>
            {% else %}
            <div class="empty-state">No tasks available. Add one above!</div>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
